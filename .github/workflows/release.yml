name: Downloadable plugin release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Verify tag and build package
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          npm pack
      - name: Publish GitHub download
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" qq-life-*.tgz --verify-tag --generate-notes
